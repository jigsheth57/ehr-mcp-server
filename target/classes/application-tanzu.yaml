server:
  port: 8080

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  ai:
    mcp:
      server:
        name: hospital-ehr-mcp-server
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse