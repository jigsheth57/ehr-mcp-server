server:
  port: 8081

spring:
  application:
    name: ehr-mcp-server
  datasource:
    url: jdbc:postgresql://localhost:5432/ehr_db
    username: myappuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    mcp:
      server:
        name: hospital-ehr-mcp-server
        version: 1.0.0
        type: SYNC
        sse-endpoint: /sse