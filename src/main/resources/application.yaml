server:
  address: 127.0.0.1
  port: ${PORT:8081}
spring:
  application:
    name: ehr-mcp-server
  datasource:
    url: ${DEMO_DB_URL:jdbc:postgresql://127.0.0.1:55432/clinical_triage_demo}
    username: ${DEMO_DB_USER:clinical_demo}
    password: ${DEMO_DB_PASSWORD}
  flyway:
    locations: classpath:db/demo
  sql:
    init:
      mode: never
  ai:
    mcp:
      server:
        name: synthetic-hospital-tools
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
demo:
  token-secret: ${DEMO_TOKEN_SECRET}
  ollama-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
  embedding-model: ${DEMO_EMBEDDING_MODEL:nomic-embed-text}
